[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corporaterisk"
version = "1.0.0"
description = "CorporateRisk - Company Credit Health Check (educational corporate credit analysis)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
